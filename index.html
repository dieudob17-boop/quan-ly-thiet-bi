<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tra Cứu LBS">
    <title>Quản lý MC/LBS (Online)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Thư viện vẽ biểu đồ siêu nhẹ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 flex justify-center">
    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-lg">
        
        <!-- Header màu xanh -->
        <div class="bg-blue-600 rounded-b-3xl p-5 pt-8 shadow-md">
            <div class="flex items-center text-white mb-6">
                <div class="w-10 h-10 bg-blue-500 rounded-lg flex justify-center items-center mr-3"><i class="fa-solid fa-bolt text-xl"></i></div>
                <div>
                    <h1 class="text-2xl font-bold">MC / LBS</h1>
                    <p class="text-sm text-blue-200"><i class="fa-solid fa-cloud"></i> Đã đồng bộ máy chủ</p>
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-3 mb-4 text-center">
                <div class="bg-blue-700/50 rounded-xl p-2 border border-blue-500 text-white"><div class="text-xs text-blue-200">MC</div><div class="text-lg font-bold" id="count-mc">0</div></div>
                <div class="bg-blue-700/50 rounded-xl p-2 border border-blue-500 text-white"><div class="text-xs text-blue-200">LBS</div><div class="text-lg font-bold" id="count-lbs">0</div></div>
                <div class="bg-blue-700/50 rounded-xl p-2 border border-blue-500 text-white"><div class="text-xs text-blue-200">Tổng</div><div class="text-lg font-bold" id="count-total">0</div></div>
            </div>
            
            <div class="bg-white rounded-full p-1 flex items-center shadow-lg">
                <i class="fa-solid fa-search text-gray-400 ml-4"></i>
                <input type="text" id="searchInput" class="w-full py-2 px-3 outline-none rounded-full text-base" placeholder="Tìm tên, IP, hãng, tình trạng...">
            </div>
        </div>

        <!-- ================= VÙNG THỐNG KÊ (DASHBOARD) ================= -->
        <div id="dashboardView" class="p-5 pb-24">
            <h2 class="text-lg font-bold text-gray-700 mb-4"><i class="fa-solid fa-chart-pie text-blue-500"></i> Tổng quan hệ thống</h2>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                <h3 class="text-xs font-bold text-gray-500 text-center mb-2 uppercase">Tình trạng kết nối / Vận hành</h3>
                <div class="relative h-48 w-full"><canvas id="statusChart"></canvas></div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                <h3 class="text-xs font-bold text-gray-500 text-center mb-2 uppercase">Top nguyên nhân sự cố</h3>
                <div class="relative h-48 w-full"><canvas id="issueChart"></canvas></div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                <h3 class="text-xs font-bold text-gray-500 text-center mb-2 uppercase">Cơ cấu Hãng sản xuất</h3>
                <div class="relative h-48 w-full"><canvas id="manuChart"></canvas></div>
            </div>
        </div>

        <!-- ================= VÙNG DANH SÁCH TÌM KIẾM ================= -->
        <div id="listView" class="hidden p-5 pb-24">
            <button id="filterWarningBtn" class="w-full bg-orange-500 text-white py-2 rounded-xl font-bold shadow-sm mb-4 text-sm flex justify-center items-center gap-2 hover:bg-orange-600"><i class="fa-solid fa-triangle-exclamation"></i> Lọc danh sách lỗi (<span id="count-warning">0</span>)</button>
            <p class="text-sm text-gray-500 mb-4 font-medium" id="display-count">Nhập từ khóa để tìm kiếm...</p>
            <div id="deviceList" class="flex flex-col gap-4"></div>
        </div>

        <!-- ================= THANH ĐIỀU HƯỚNG DƯỚI ĐÁY TỪNG ================= -->
        <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pt-2 pb-4 z-40 shadow-[0_-5px_10px_rgba(0,0,0,0.03)]">
            <button id="tabChartBtn" class="flex flex-col items-center w-1/4 text-blue-600 transition-colors">
                <i class="fa-solid fa-chart-simple text-xl mb-1"></i><span class="text-[10px] font-bold">Tổng quan</span>
            </button>
            <button id="tabListBtn" class="flex flex-col items-center w-1/4 text-gray-400 transition-colors">
                <i class="fa-solid fa-list text-xl mb-1"></i><span class="text-[10px] font-bold">Tra cứu</span>
            </button>
            <button id="manualBtn" class="flex flex-col items-center w-1/4 text-gray-400 transition-colors">
                <i class="fa-solid fa-book text-xl mb-1"></i><span class="text-[10px] font-bold">HD Vận hành</span>
            </button>
            <button id="addBtn" class="flex flex-col items-center w-1/4 text-gray-400 transition-colors">
                <i class="fa-solid fa-circle-plus text-xl mb-1"></i><span class="text-[10px] font-bold">Thêm mới</span>
            </button>
        </div>

        <!-- ================= CÁC CỬA SỔ MODAL (GIỮ NGUYÊN) ================= -->
        <!-- 1. Modal Hướng dẫn vận hành -->
        <div id="manualModal" class="hidden fixed top-0 left-0 w-full h-full bg-black/60 z-50 flex justify-center items-center"><div class="bg-white p-5 rounded-2xl w-11/12 max-h-[90vh] flex flex-col shadow-2xl"><div class="flex justify-between items-center mb-4 pb-2 border-b"><h2 class="text-xl font-bold text-teal-700"><i class="fa-solid fa-book-open"></i> Hướng dẫn vận hành</h2><button id="closeManualBtn" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-2xl"></i></button></div><input type="text" id="searchManual" placeholder="Tìm tài liệu..." class="w-full border p-2 rounded-lg mb-4 bg-gray-50 outline-none text-base"><div id="manualList" class="flex flex-col gap-3 overflow-y-auto pb-2 h-96"></div></div></div>

        <!-- 2. Modal Bảo mật -->
        <div id="passwordModal" class="hidden fixed top-0 left-0 w-full h-full bg-black/70 z-[60] flex justify-center items-center"><div class="bg-white p-6 rounded-2xl w-10/12 max-w-sm"><h2 class="text-xl font-bold mb-2 text-red-600"><i class="fa-solid fa-lock"></i> Bảo mật</h2><p class="text-sm mb-4">Nhập mật khẩu quản trị để Thêm thiết bị.</p><input type="password" id="adminPassword" class="w-full border p-3 rounded-lg mb-4 bg-gray-50 outline-none text-center tracking-widest font-bold text-base"><div class="flex justify-end gap-3"><button id="cancelPassBtn" class="px-5 py-2 bg-gray-200 rounded-lg font-bold">Hủy</button><button id="submitPassBtn" class="px-5 py-2 bg-red-600 text-white rounded-lg font-bold">Xác nhận</button></div></div></div>
        
        <!-- 3. Modal Báo cáo hiện trường -->
        <div id="reportModal" class="hidden fixed top-0 left-0 w-full h-full bg-black/60 z-50 flex justify-center items-center"><div class="bg-white p-5 rounded-2xl w-11/12 max-h-[90vh] overflow-y-auto"><h2 class="text-xl font-bold mb-1 text-orange-600"><i class="fa-solid fa-flag"></i> Báo cáo hiện trường</h2><p id="reportDeviceName" class="text-sm font-bold text-gray-700 mb-4 pb-2 border-b"></p><label class="text-xs font-bold text-gray-500 mb-2 block">Tick nhanh lỗi:</label><div class="flex flex-col gap-2 mb-4 text-sm font-medium"><label class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border"><input type="checkbox" class="report-cb w-4 h-4 accent-orange-500" value="Sóng yếu / Chập chờn"> Sóng yếu / Chập chờn</label><label class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border"><input type="checkbox" class="report-cb w-4 h-4 accent-orange-500" value="Lỗi Modem / Mất 3G"> Lỗi Modem / Mất 3G</label><label class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border"><input type="checkbox" class="report-cb w-4 h-4 accent-orange-500" value="Ắc quy yếu / Hỏng"> Ắc quy yếu / Hỏng</label><label class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border"><input type="checkbox" class="report-cb w-4 h-4 accent-orange-500" value="Mất nguồn AC"> Mất nguồn điện AC</label><label class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border"><input type="checkbox" class="report-cb w-4 h-4 accent-orange-500" value="Tủ điều khiển lỗi"> Tủ điều khiển lỗi</label></div><textarea id="reportNote" class="w-full border p-2 rounded-lg mb-2 h-20 text-base bg-gray-50 outline-none" placeholder="Ghi chú chi tiết..."></textarea><input type="hidden" id="reportDeviceId"><div class="flex justify-between items-center mt-2"><button id="clearReportBtn" class="text-xs text-red-500 font-bold px-2 py-2 hidden"><i class="fa-solid fa-trash"></i> Xóa báo cáo</button><div class="flex justify-end gap-2 flex-1"><button id="cancelReportBtn" class="px-4 py-2 bg-gray-200 font-bold rounded-lg">Hủy</button><button id="saveReportBtn" class="px-4 py-2 bg-orange-500 text-white font-bold rounded-lg">Gửi báo cáo</button></div></div></div></div>

        <!-- 4. Modal Thêm thiết bị mới -->
        <div id="addModal" class="hidden fixed top-0 left-0 w-full h-full bg-black/60 z-50 flex justify-center items-center"><div class="bg-white p-6 rounded-2xl w-11/12 max-h-[90vh] overflow-y-auto"><h2 class="text-xl font-bold mb-4 text-blue-700">Thêm thiết bị mới</h2><input type="text" id="inputName" placeholder="Tên thiết bị..." class="w-full border p-2 rounded-lg mb-3 bg-gray-50 outline-none text-base"><input type="text" id="inputIP" placeholder="Địa chỉ IP..." class="w-full border p-2 rounded-lg mb-3 bg-gray-50 outline-none text-base"><input type="text" id="inputManufacturer" placeholder="Hãng sản xuất..." class="w-full border p-2 rounded-lg mb-3 bg-gray-50 outline-none text-base"><select id="inputType" class="w-full border p-2 rounded-lg mb-3 bg-gray-50 outline-none text-base"><option value="MC">MC</option><option value="LBS">LBS</option></select><select id="inputConnection" class="w-full border p-2 rounded-lg mb-3 bg-gray-50 outline-none text-base"><option value="Tốt">Tốt</option><option value="Mất kết nối">Mất kết nối</option></select><input type="text" id="inputOperation" placeholder="Tình trạng vận hành..." class="w-full border p-2 rounded-lg mb-4 bg-gray-50 outline-none text-base"><div class="flex justify-end gap-3 mt-2"><button id="cancelBtn" class="px-5 py-2 bg-gray-200 font-bold rounded-lg">Hủy</button><button id="saveBtn" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-lg">Lưu mạng</button></div></div></div>
    </div>
    
    <script src="script.js?v=6"></script>
</body>
</html>
