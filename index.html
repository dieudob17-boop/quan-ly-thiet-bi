<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý REC/LBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center">
    <div class="w-full max-w-md bg-white min-h-screen relative shadow-lg">
        
        <!-- Header màu xanh -->
        <div class="bg-blue-600 rounded-b-3xl p-5 pt-8 shadow-md">
            <div class="flex items-center text-white mb-6">
                <div class="w-10 h-10 bg-blue-500 rounded-lg flex justify-center items-center mr-3">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">REC / LBS</h1>
                    <p class="text-sm text-blue-200">Thiết bị đã kết nối lên TTĐK</p>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6 text-center">
                <div class="bg-blue-700/50 rounded-xl p-3 border border-blue-500 text-white">
                    <div class="text-xs text-blue-200 flex justify-center items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400"></span> LBS</div>
                    <div class="text-xl font-bold mt-1" id="count-lbs">0</div>
                </div>
                <div class="bg-blue-700/50 rounded-xl p-3 border border-blue-500 text-white">
                    <div class="text-xs text-blue-200 flex justify-center items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400"></span> REC/MC</div>
                    <div class="text-xl font-bold mt-1" id="count-mc">0</div>
                </div>
                <div class="bg-blue-700/50 rounded-xl p-3 border border-blue-500 text-white">
                    <div class="text-xs text-blue-200 flex justify-center items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-400"></span> Tổng</div>
                    <div class="text-xl font-bold mt-1" id="count-total">0</div>
                </div>
            </div>

            <div class="bg-white rounded-full p-1 flex items-center shadow-lg">
                <i class="fa-solid fa-search text-gray-400 ml-4"></i>
                <input type="text" id="searchInput" class="w-full py-2 px-3 outline-none rounded-full" placeholder="Tìm tên, IP, modem, hãng...">
            </div>
        </div>

        <!-- Danh sách thiết bị -->
        <div class="p-5 pb-24">
            <p class="text-sm text-gray-500 mb-4" id="display-count">Hiển thị 0/0 thiết bị</p>
            <div id="deviceList" class="flex flex-col gap-4"></div>
        </div>
<!-- Nút Nhập File CSV -->
<label for="importCsv" class="fixed bottom-6 right-1/2 -translate-x-8 bg-green-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-green-700 flex items-center gap-2 font-bold z-10 cursor-pointer">
    <i class="fa-solid fa-file-import"></i> Nhập File
</label>
<input type="file" id="importCsv" accept=".csv" class="hidden">
        <!-- Nút Thêm -->
        <button id="addBtn" class="fixed bottom-6 right-1/2 translate-x-32 bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-blue-700 flex items-center gap-2 font-bold z-10">
            <i class="fa-solid fa-plus"></i> Thêm
        </button>

        <!-- Form nhập thiết bị mới (ẩn ban đầu) -->
        <div id="addModal" class="hidden absolute top-0 left-0 w-full h-full bg-black/50 z-20 flex justify-center items-center">
            <div class="bg-white p-6 rounded-2xl w-11/12">
                <h2 class="text-xl font-bold mb-4">Thêm thiết bị mới</h2>
                <input type="text" id="inputName" placeholder="Tên (VD: LBS 471...)" class="w-full border p-3 rounded-lg mb-3 outline-none">
                <input type="text" id="inputIP" placeholder="IP (VD: 172.16.0.1)" class="w-full border p-3 rounded-lg mb-3 outline-none">
                <select id="inputType" class="w-full border p-3 rounded-lg mb-3 outline-none">
                    <option value="LBS">LBS</option>
                    <option value="REC/MC">REC/MC</option>
                </select>
                <input type="text" id="inputManufacturer" placeholder="Hãng sản xuất" class="w-full border p-3 rounded-lg mb-3 outline-none">
                <select id="inputStatus" class="w-full border p-3 rounded-lg mb-4 outline-none">
                    <option value="Bình thường">Bình thường (Màu xanh)</option>
                    <option value="Cảnh báo">Mất kết nối (Màu đỏ)</option>
                </select>
                <div class="flex justify-end gap-2">
                    <button id="cancelBtn" class="px-4 py-2 text-gray-500 font-bold">Hủy</button>
                    <button id="saveBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">Lưu vào kho</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
